<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b22" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Purple Glow -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <g filter="url(#shadowFilter)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" />
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="url(#borderGrad)" stroke-width="6" />
  </g>

  <!-- Terminal Window Bar -->
  <g opacity="0.85">
    <circle cx="160" cy="160" r="14" fill="#ef4444" opacity="0.8" />
    <circle cx="210" cy="160" r="14" fill="#f59e0b" opacity="0.8" />
    <circle cx="260" cy="160" r="14" fill="#10b981" opacity="0.8" />
    <line x1="120" y1="210" x2="904" y2="210" stroke="#334155" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Inner Terminal Canvas Grid (Subtle Matrix) -->
  <g opacity="0.12">
    <line x1="200" y1="260" x2="200" y2="860" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <line x1="360" y1="260" x2="360" y2="860" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <line x1="520" y1="260" x2="520" y2="860" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <line x1="680" y1="260" x2="680" y2="860" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
    <line x1="840" y1="260" x2="840" y2="860" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" />
  </g>

  <!-- Center Artwork: Modern Terminal Command Prompt '>' -->
  <g filter="url(#neonGlow)">
    <polyline points="200,380 340,512 200,644" 
              fill="none" 
              stroke="url(#cyanGrad)" 
              stroke-width="48" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
  </g>

  <!-- Agentic AI Core Nodes & Diamond Lattice -->
  <g transform="translate(620, 512)" filter="url(#neonGlow)">
    <!-- Outer Octagon / Orbit Ring -->
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" 
             fill="none" 
             stroke="#818cf8" 
             stroke-width="6" 
             stroke-dasharray="16,8" 
             opacity="0.6" />

    <!-- Neural Connectors -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#38bdf8" stroke-width="6" opacity="0.8" />
    <line x1="0" y1="0" x2="104" y2="60" stroke="#c084fc" stroke-width="6" opacity="0.8" />
    <line x1="0" y1="0" x2="-104" y2="60" stroke="#34d399" stroke-width="6" opacity="0.8" />

    <!-- Node Circles -->
    <circle cx="0" cy="-120" r="18" fill="url(#cyanGrad)" />
    <circle cx="104" cy="60" r="18" fill="url(#purpleGrad)" />
    <circle cx="-104" cy="60" r="18" fill="url(#emeraldGrad)" />

    <!-- Central Diamond Core -->
    <polygon points="0,-60 60,0 0,60 -60,0" fill="url(#cyanGrad)" opacity="0.9" />
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#ffffff" />
  </g>

  <!-- Terminal Pulsing Underscore Cursor '_' -->
  <g filter="url(#neonGlow)">
    <rect x="380" y="620" width="90" height="24" rx="6" fill="#38bdf8" />
  </g>

  <!-- Subtle Badge Text at Bottom -->
  <text x="512" y="860" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'JetBrains Mono', sans-serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="14" 
        fill="#64748b" 
        text-anchor="middle" 
        opacity="0.8">AGENTIC</text>
</svg>
